<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#010409" />
      <stop offset="0.55" stop-color="#0d1117" />
      <stop offset="1" stop-color="#16213a" />
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#f0f6fc" stop-opacity="0.45" />
      <stop offset="1" stop-color="#f0f6fc" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="300" rx="16" fill="url(#sky)" />

  <!-- aurora -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="0,0; -34,6; 0,0; 34,-4; 0,0" keyTimes="0;0.25;0.5;0.75;1" />
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.75;1;0.7;1;0.75" keyTimes="0;0.25;0.5;0.75;1" />
    <path d="M290,62 C410,18 520,104 640,58 S750,38 815,72" stroke="#7ee787" stroke-width="30" opacity="0.28" />
    <path d="M270,102 C400,58 560,132 705,88" stroke="#58a6ff" stroke-width="24" opacity="0.22" />
    <path d="M330,44 C430,14 540,84 660,44" stroke="#d2a8ff" stroke-width="16" opacity="0.15" />
  </g>

  <!-- stars -->
  <g fill="#e6edf3">
    <g><animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="0.25;1;0.25" keyTimes="0;0.5;1" />
      <circle cx="60" cy="40" r="1.5" /><circle cx="330" cy="90" r="1.2" /><circle cx="620" cy="30" r="1.6" /><circle cx="150" cy="90" r="1" /><circle cx="770" cy="120" r="1.3" /><circle cx="240" cy="140" r="1" /></g>
    <g><animate attributeName="opacity" dur="3.4s" repeatCount="indefinite" values="1;0.3;1" keyTimes="0;0.5;1" />
      <circle cx="110" cy="120" r="1.2" /><circle cx="420" cy="40" r="1.5" /><circle cx="740" cy="40" r="1.2" /><circle cx="380" cy="130" r="1" /><circle cx="700" cy="150" r="1.4" /></g>
    <g><animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" values="0.5;1;0.4;1;0.5" keyTimes="0;0.3;0.5;0.8;1" />
      <circle cx="200" cy="60" r="1.3" /><circle cx="480" cy="110" r="1" /><circle cx="260" cy="30" r="1.5" /><circle cx="540" cy="50" r="1.2" /><circle cx="40" cy="160" r="1" /><circle cx="580" cy="140" r="1.2" /></g>
  </g>

  <!-- moon -->
  <circle cx="120" cy="68" r="58" fill="url(#moonGlow)" />
  <circle cx="120" cy="68" r="24" fill="#f0f6fc" />
  <g fill="#c9d4e0" opacity="0.65">
    <circle cx="112" cy="60" r="3.5" /><circle cx="128" cy="74" r="2.5" /><circle cx="120" cy="80" r="2" />
  </g>

  <!-- shooting star -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="-120,14; -120,14; 900,150; 900,150" keyTimes="0;0.68;0.76;1" />
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.68;0.715;0.76;1" />
    <line x1="0" y1="0" x2="64" y2="17" stroke="url(#streak)" stroke-width="2" stroke-linecap="round" />
    <circle cx="66" cy="18" r="1.8" fill="#ffffff" />
  </g>

  <!-- mountains -->
  <path d="M0,222 L120,150 L240,212 L360,160 L520,227 L640,175 L800,232 L800,300 L0,300 Z" fill="#1a2230" />

  <!-- front hill -->
  <path d="M0,300 L0,266 C150,236 300,276 450,251 C600,229 700,246 800,239 L800,300 Z" fill="#010409" />

  <!-- cat silhouette -->
  <g fill="#010409" stroke="#30363d" stroke-width="1">
    <path d="M590,244 C585,212 596,191 616,186 C641,180 656,201 653,244 Z" />
    <circle cx="602" cy="172" r="15" />
    <path d="M591,164 L586,148 L600,159 Z" />
    <path d="M612,162 L618,146 L624,160 Z" />
  </g>
  <path d="M650,236 Q692,230 696,204" fill="none" stroke="#010409" stroke-width="11" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" dur="3.6s" repeatCount="indefinite" values="-7 650 236; 7 650 236; -7 650 236" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" />
  </path>

  <!-- fireflies -->
  <g fill="#e3b341">
    <circle r="2"><animateMotion dur="7s" repeatCount="indefinite" path="M520,215 C535,203 550,220 538,229 C525,237 508,225 520,215 Z" /><animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" values="0.15;1;0.15" /></circle>
    <circle r="1.7"><animateMotion dur="9s" repeatCount="indefinite" path="M560,200 C546,190 535,208 550,215 C565,220 572,208 560,200 Z" /><animate attributeName="opacity" dur="2.3s" repeatCount="indefinite" values="1;0.2;1" /></circle>
    <circle r="2"><animateMotion dur="8s" repeatCount="indefinite" path="M700,212 C712,198 726,210 715,222 C704,232 690,224 700,212 Z" /><animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="0.2;1;0.2" /></circle>
    <circle r="1.5"><animateMotion dur="6s" repeatCount="indefinite" path="M480,230 C490,222 500,234 488,240 C476,244 470,236 480,230 Z" /><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="0.9;0.15;0.9" /></circle>
  </g>
</svg>
