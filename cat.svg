<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .laptop { fill: #30363d; }
      .screen { fill: #161b22; stroke: #30363d; stroke-width: 2; }
      .code-line-1 { fill: #58a6ff; animation: codePulse 2s infinite; }
      .code-line-2 { fill: #7ee787; animation: codePulse 2s infinite 0.5s; }
      .code-line-3 { fill: #ffa657; animation: codePulse 2s infinite 1s; }
      .cat-body { fill: #f0883e; }
      .cat-dark { fill: #d16d28; }
      .cat-ear { fill: #f7a862; }
      .paw-left { animation: typeLeft 0.4s infinite alternate ease-in-out; }
      .paw-right { animation: typeRight 0.4s infinite alternate-reverse ease-in-out; }
      .tail { transform-origin: 280px 160px; animation: wag 1.8s infinite ease-in-out; }
      .eye { fill: #0d1117; }

      @keyframes typeLeft {
        from { transform: translateY(0px); }
        to { transform: translateY(-4px); }
      }
      @keyframes typeRight {
        from { transform: translateY(-4px); }
        to { transform: translateY(0px); }
      }
      @keyframes wag {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(12deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes codePulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect class="bg" width="400" height="240" />

  <!-- Laptop Screen -->
  <rect class="screen" x="120" y="50" width="160" height="100" rx="6" />
  <rect class="code-line-1" x="135" y="70" width="60" height="6" rx="3" />
  <rect class="code-line-2" x="135" y="85" width="90" height="6" rx="3" />
  <rect class="code-line-3" x="135" y="100" width="45" height="6" rx="3" />
  <rect class="code-line-1" x="135" y="115" width="75" height="6" rx="3" />

  <!-- Laptop Base -->
  <path class="laptop" d="M100,155 L300,155 L310,165 L90,165 Z" />

  <!-- Cat Body -->
  <ellipse class="cat-body" cx="240" cy="170" rx="35" ry="25" />

  <!-- Cat Tail -->
  <path class="cat-dark tail" d="M270,165 Q310,150 300,120" stroke="#f0883e" stroke-width="10" stroke-linecap="round" fill="none" />

  <!-- Cat Head -->
  <circle class="cat-body" cx="200" cy="140" r="28" />

  <!-- Cat Ears -->
  <polygon class="cat-body" points="180,120 170,95 195,110" />
  <polygon class="cat-ear" points="182,118 174,100 192,112" />

  <polygon class="cat-body" points="220,120 230,95 205,110" />
  <polygon class="cat-ear" points="218,118 226,100 208,112" />

  <!-- Cat Face -->
  <circle class="eye" cx="190" cy="135" r="3.5" />
  <circle class="eye" cx="210" cy="135" r="3.5" />
  <polygon fill="#d16d28" points="200,142 196,138 204,138" />

  <!-- Paws on Laptop -->
  <ellipse class="cat-body paw-left" cx="175" cy="156" rx="8" ry="5" />
  <ellipse class="cat-body paw-right" cx="225" cy="156" rx="8" ry="5" />
</svg>
