<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" role="img" aria-label="Somasundaram Maharajan — Integration, Platform and Agentic Engineering. An animated diagram of messages flowing through a pipeline: source, transform, transport, orchestrate, target.">
  <title>Somasundaram Maharajan — Integration, Platform and Agentic Engineering</title>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   class="c1"/>
      <stop offset="55%"  class="c2"/>
      <stop offset="100%" class="c3"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="55%"  stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="45%"  stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" class="grid-line" stroke-width="1"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="8" y="8" width="864" height="252" rx="18"/>
    </clipPath>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <style>
    /* Dark is the default rather than the override: if the colour query never
       fires, the card is still legible instead of white-on-white. */
    .c1 { stop-color: #0a1020; }
    .c2 { stop-color: #101c33; }
    .c3 { stop-color: #0d1628; }
    .grid-line { stroke: #1e2f4d; }
    .name      { fill: #f1f5f9; }
    .role      { fill: #9fb3c8; }
    .frame     { stroke: #2a3f63; }
    .node-face { fill: #111d33; }
    .node-dot  { fill: #64748b; }
    .edge      { stroke: #24395c; }
    .tag-face  { fill: #12203a; stroke: #24395c; }
    .tag-text  { fill: #8fa8c2; }

    @media (prefers-color-scheme: light) {
      .c1 { stop-color: #f7fafc; }
      .c2 { stop-color: #eef3f9; }
      .c3 { stop-color: #e7eef6; }
      .grid-line { stroke: #d8e2ee; }
      .name      { fill: #0b1728; }
      .role      { fill: #3d566f; }
      .frame     { stroke: #cfdcea; }
      .node-face { fill: #ffffff; }
      .node-dot  { fill: #94a3b8; }
      .edge      { stroke: #c2d2e4; }
      .tag-face  { fill: #ffffff; stroke: #cfdcea; }
      .tag-text  { fill: #48627c; }
    }

    /* fill-mode backwards, not a base opacity:0 — if the animation never runs
       (odd renderer, animation disabled, static export) the content must still
       be on screen. Motion is the enhancement, never the thing that reveals. */
    .rise {
      animation: rise .85s cubic-bezier(.22,.9,.3,1) backwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .draw {
      animation: draw 1.1s ease-out .35s backwards;
    }
    @keyframes draw {
      from { stroke-dasharray: 210; stroke-dashoffset: 210; }
      to   { stroke-dasharray: 210; stroke-dashoffset: 0; }
    }

    /* Packets ride the wire with CSS offset-path rather than SMIL, so the
       reduced-motion query below can stop every moving part in one place. */
    .packet {
      offset-rotate: 0deg;
      animation: flow 3.4s linear infinite;
    }
    @keyframes flow {
      0%   { offset-distance: 0%;   opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 3.4s ease-out infinite;
      opacity: 0;
    }
    @keyframes pulse {
      0%, 55% { transform: scale(.65); opacity: 0; }
      70%     { opacity: .55; }
      100%    { transform: scale(1.9); opacity: 0; }
    }

    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes sweep {
      0%, 100% { transform: translateX(-320px); }
      50%      { transform: translateX(880px); }
    }

    /* Everything above is CSS precisely so this one block can switch it off. */
    @media (prefers-reduced-motion: reduce) {
      .rise, .draw, .packet, .pulse, .sweep {
        animation: none !important;
      }
      .packet { offset-distance: 62%; }
      .pulse  { opacity: .22 !important; }
    }
  </style>

  <rect x="8" y="8" width="864" height="252" rx="18" fill="url(#card)"/>
  <g clip-path="url(#cardClip)">
    <rect x="8" y="8" width="864" height="252" fill="url(#grid)" opacity="0.5"/>
    <rect class="sweep" x="0" y="8" width="300" height="252" fill="url(#sweep)"/>
  </g>
  <rect x="8" y="8" width="864" height="252" rx="18" fill="none" class="frame" stroke-width="1"/>

  <g class="rise" style="animation-delay:.05s">
    <text x="48" y="68" class="name" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="31" font-weight="700" letter-spacing="-0.4">Somasundaram Maharajan</text>
  </g>

  <g class="rise" style="animation-delay:.2s">
    <text x="49" y="96" class="role" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6">INTEGRATION · PLATFORM · AGENTIC ENGINEERING</text>
  </g>

  <rect x="48" y="110" width="210" height="2" rx="1" fill="url(#rule)" class="draw" stroke="none"/>

  <!-- Wires, drawn first so the hop nodes sit on top of them. -->
  <g fill="none" class="edge" stroke-width="1.6" stroke-linecap="round">
    <path d="M132,192 C186,156 222,156 276,192"/>
    <path d="M276,192 C330,228 366,228 420,192"/>
    <path d="M420,192 C474,156 510,156 564,192"/>
    <path d="M564,192 C618,228 654,228 708,192"/>
  </g>

  <!-- Each packet's offset-path repeats its wire's geometry: CSS inside a
       standalone SVG cannot reference a path by id, so the duplication is
       unavoidable. tools/check_header.py asserts the two never drift apart. -->
  <g filter="url(#soft)">
    <circle class="packet" r="9" fill="url(#glow)" style="offset-path:path('M132,192 C186,156 222,156 276,192'); animation-delay:0s"/>
    <circle class="packet" r="9" fill="url(#glow)" style="offset-path:path('M276,192 C330,228 366,228 420,192'); animation-delay:.85s"/>
    <circle class="packet" r="9" fill="url(#glow)" style="offset-path:path('M420,192 C474,156 510,156 564,192'); animation-delay:1.7s"/>
    <circle class="packet" r="9" fill="url(#glow)" style="offset-path:path('M564,192 C618,228 654,228 708,192'); animation-delay:2.55s"/>
  </g>
  <g>
    <circle class="packet" r="3" fill="#e0f2fe" style="offset-path:path('M132,192 C186,156 222,156 276,192'); animation-delay:0s"/>
    <circle class="packet" r="3" fill="#e0f2fe" style="offset-path:path('M276,192 C330,228 366,228 420,192'); animation-delay:.85s"/>
    <circle class="packet" r="3" fill="#e0f2fe" style="offset-path:path('M420,192 C474,156 510,156 564,192'); animation-delay:1.7s"/>
    <circle class="packet" r="3" fill="#e0f2fe" style="offset-path:path('M564,192 C618,228 654,228 708,192'); animation-delay:2.55s"/>
  </g>

  <!-- Hops. Each ring pulses as the packet on its inbound wire lands. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g class="rise" style="animation-delay:.45s">
      <circle class="pulse" cx="132" cy="192" r="20" fill="none" stroke="#38bdf8" stroke-width="1.4" style="animation-delay:2.55s"/>
      <circle cx="132" cy="192" r="20" class="node-face" stroke="#38bdf8" stroke-width="1.6"/>
      <circle cx="132" cy="192" r="3.5" class="node-dot"/>
      <text x="132" y="234" class="tag-text" font-size="9.5" letter-spacing=".8">SOURCE</text>
    </g>
    <g class="rise" style="animation-delay:.55s">
      <circle class="pulse" cx="276" cy="192" r="20" fill="none" stroke="#38bdf8" stroke-width="1.4" style="animation-delay:0s"/>
      <circle cx="276" cy="192" r="20" class="node-face" stroke="#38bdf8" stroke-width="1.6"/>
      <circle cx="276" cy="192" r="3.5" class="node-dot"/>
      <text x="276" y="234" class="tag-text" font-size="9.5" letter-spacing=".8">TRANSFORM</text>
    </g>
    <g class="rise" style="animation-delay:.65s">
      <circle class="pulse" cx="420" cy="192" r="20" fill="none" stroke="#2dd4bf" stroke-width="1.4" style="animation-delay:.85s"/>
      <circle cx="420" cy="192" r="20" class="node-face" stroke="#2dd4bf" stroke-width="1.6"/>
      <circle cx="420" cy="192" r="3.5" class="node-dot"/>
      <text x="420" y="234" class="tag-text" font-size="9.5" letter-spacing=".8">TRANSPORT</text>
    </g>
    <g class="rise" style="animation-delay:.75s">
      <circle class="pulse" cx="564" cy="192" r="20" fill="none" stroke="#2dd4bf" stroke-width="1.4" style="animation-delay:1.7s"/>
      <circle cx="564" cy="192" r="20" class="node-face" stroke="#2dd4bf" stroke-width="1.6"/>
      <circle cx="564" cy="192" r="3.5" class="node-dot"/>
      <text x="564" y="234" class="tag-text" font-size="9.5" letter-spacing=".8">ORCHESTRATE</text>
    </g>
    <g class="rise" style="animation-delay:.85s">
      <circle class="pulse" cx="708" cy="192" r="20" fill="none" stroke="#fbbf24" stroke-width="1.4" style="animation-delay:2.55s"/>
      <circle cx="708" cy="192" r="20" class="node-face" stroke="#fbbf24" stroke-width="1.6"/>
      <circle cx="708" cy="192" r="3.5" class="node-dot"/>
      <text x="708" y="234" class="tag-text" font-size="9.5" letter-spacing=".8">TARGET</text>
    </g>
  </g>

</svg>
